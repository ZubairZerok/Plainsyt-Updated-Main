    <script>
      // AGGRESSIVE CACHE KILLER: Completely unregister any service worker & wipe CacheStorage on localhost
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister();
              console.log('[Plainsyt] Stale Service Worker unregistered.');
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) {
                caches.delete(name);
                console.log('[Plainsyt] Stale cache purged:', name);
              }
            });
          }
        }
      }
    </script>
