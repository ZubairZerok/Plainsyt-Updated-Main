<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like and idea reaction buttons</title>
<style>
:root{
  --bg:#E9EEF5; --card:#FFFFFF; --ink:#14213D; --muted:#586480; --line:#D3DBE8;
  --like:#E5385F; --like-t:#C8244B; --like-soft:#FDE7EC;
  --idea:#F2A900; --idea-t:#7A5400; --idea-soft:#FFF2C4;
  --focus:#2F5BEA;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1525; --card:#18213A; --ink:#EAF0FF; --muted:#9AA7C4; --line:#2B3658;
    --like:#FF6B8A; --like-t:#FF8FA6; --like-soft:#3B2030;
    --idea:#FFC933; --idea-t:#FFD966; --idea-soft:#3A3114;
    --focus:#8FA8FF;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:clamp(1rem,4vw,3rem); min-height:100vh;
}
main{max-width:640px;margin:0 auto;display:grid;gap:2.5rem}
.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(1.25rem,4vw,2rem)}
.post h1{font:600 clamp(1.5rem,4vw,2rem)/1.2 Charter,"Iowan Old Style",Georgia,serif;margin:0 0 .6rem}
.post p{margin:0 0 1.5rem;color:var(--muted);max-width:60ch;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
#status{min-height:1.5em;margin:1rem 0 0;font-size:.9rem;color:var(--muted)}
.reset{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;padding:.4rem}
.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- the reaction button ---------- */
.react{
  --c:var(--like); --t:var(--like-t); --soft:var(--like-soft);
  position:relative; display:inline-flex; align-items:center; gap:.6rem;
  padding:.6rem 1rem .6rem .8rem; border-radius:999px;
  border:1.5px solid var(--line); background:var(--card); color:var(--muted);
  font:600 .95rem/1 inherit; font-family:inherit; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
}
.react[data-kind="idea"]{--c:var(--idea); --t:var(--idea-t); --soft:var(--idea-soft)}

/* hover */
.react:hover:not(:disabled), .react.is-hover{border-color:var(--c);color:var(--t);transform:translateY(-1px);box-shadow:0 4px 14px -6px var(--c)}
/* keyboard focus */
.react:focus-visible, .react.is-focus{outline:3px solid var(--focus);outline-offset:3px}
/* pressed */
.react:active:not(:disabled), .react.is-pressed{transform:scale(.94);box-shadow:none}
/* active (toggled on) */
.react[aria-pressed="true"]{background:var(--soft);border-color:var(--c);color:var(--t)}
/* disabled */
.react:disabled{opacity:.45;cursor:not-allowed}

.ico-wrap{position:relative;display:grid;place-items:center;width:22px;height:22px}
.ico{width:22px;height:22px;overflow:visible;display:block}
.ico *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .25s, stroke .25s, opacity .25s}

/* count with roll animation */
.count{display:inline-block;overflow:hidden;min-width:2.4ch;height:1.1em;line-height:1.1;font-variant-numeric:tabular-nums}
.num{display:inline-block}
.num.up{animation:rollUp .28s ease-out}
.num.down{animation:rollDown .28s ease-out}
@keyframes rollUp{from{transform:translateY(.9em);opacity:0}to{transform:none;opacity:1}}
@keyframes rollDown{from{transform:translateY(-.9em);opacity:0}to{transform:none;opacity:1}}

/* like: heart fills, pops, bursts */
.react[aria-pressed="true"] .heart{fill:var(--c);stroke:var(--c)}
.react[data-kind="like"] .anim-on .ico{animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(.68)}62%{transform:scale(1.32)}100%{transform:scale(1)}}
.anim-off .ico{animation:shrink .25s ease-out}
@keyframes shrink{0%{transform:scale(1)}45%{transform:scale(.8)}100%{transform:scale(1)}}

/* idea: bulb lights up with a flicker, rays shine */
.rays{opacity:0;transform-origin:12px 8px;transform-box:view-box}
.rays *{stroke:var(--c);stroke-width:1.8}
.react[aria-pressed="true"] .rays{opacity:1}
.react[aria-pressed="true"] .glass{fill:var(--c);stroke:var(--c)}
.react[data-kind="idea"][aria-pressed="true"] .ico{filter:drop-shadow(0 0 5px var(--c))}
.react[data-kind="idea"] .anim-on .glass{animation:flicker .75s linear}
.react[data-kind="idea"] .anim-on .rays{animation:shine .6s ease-out}
.react[data-kind="idea"] .anim-on .ico{animation:none}
@keyframes flicker{0%{opacity:.25}15%{opacity:1}28%{opacity:.35}42%{opacity:1}55%{opacity:.6}70%,100%{opacity:1}}
@keyframes shine{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}

/* burst particles and ring */
.dot{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--c);pointer-events:none;animation:burst .6s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.ring{position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.7);opacity:0}}

/* ---------- state gallery ---------- */
.states h2{font:600 1.1rem/1.3 inherit;font-family:inherit;margin:0 0 1rem}
.states h3{font-size:.95rem;font-weight:600;margin:1.25rem 0 .75rem;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.25rem 1rem}
.cell{display:grid;gap:.5rem;justify-items:start}
.cell small{color:var(--muted);font-size:.8rem}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main>
  <article class="post">
    <h1>Slow mornings, better ideas</h1>
    <p>Most of the work that mattered this year started away from a screen. Try the reactions below: tap once to react, tap again to take it back.</p>
    <div class="bar" id="bar"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </article>

  <section class="states" aria-labelledby="states-title">
    <h2 id="states-title">All button states</h2>
    <div id="gallery" inert></div>
  </section>
</main>

<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var START = { like: 128, idea: 42 };
  var LABEL = { like: "Like", idea: "Idea" };
  var DONE  = { like: "You liked this.", idea: "You marked this as an idea." };

  var HEART = '<path class="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
  var BULB  = '<g class="rays"><path d="M12 -.2V-2.4M17.8 2.2l1.55-1.55M6.2 2.2L4.65.65M20.2 8h2.2M3.8 8H1.6"/></g>' +
              '<path class="glass" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.3 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>' +
              '<path class="base" d="M9 18h6M10 22h4"/>';

  function btn(kind, o){
    o = o || {};
    var cls = "react" + (o.cls ? " " + o.cls : "");
    return '<button type="button" class="' + cls + '" data-kind="' + kind + '" data-count="' + o.count + '"' +
      ' aria-pressed="' + !!o.on + '"' + (o.disabled ? " disabled" : "") + (o.live ? " data-live" : "") + '>' +
      '<span class="ico-wrap"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (kind === "like" ? HEART : BULB) + '</svg></span>' +
      '<span>' + LABEL[kind] + '</span>' +
      '<span class="count"><span class="num">' + o.count.toLocaleString() + '</span></span>' +
    '</button>';
  }

  // live buttons
  var bar = document.getElementById("bar");
  bar.innerHTML = btn("like", {count: START.like, live: true}) + btn("idea", {count: START.idea, live: true}) +
                  '<button type="button" class="reset" id="reset">Reset demo</button>';

  // state gallery
  var states = [
    ["Idle", ""], ["Hover", "is-hover"], ["Focus", "is-focus"],
    ["Pressed", "is-pressed"], ["Active", "", true], ["Disabled", "", false, true]
  ];
  var g = "";
  ["like", "idea"].forEach(function(kind){
    g += "<h3>" + LABEL[kind] + "</h3><div class='gallery'>";
    states.forEach(function(s){
      g += "<div class='cell'>" + btn(kind, {count: START[kind] + (s[2] ? 1 : 0), cls: s[1], on: s[2], disabled: s[3]}) + "<small>" + s[0] + "</small></div>";
    });
    g += "</div>";
  });
  document.getElementById("gallery").innerHTML = g;

  // behaviour
  var statusEl = document.getElementById("status");

  function setCount(b, n, dir){
    var num = b.querySelector(".num");
    num.textContent = n.toLocaleString();
    if (reduce) return;
    num.classList.remove("up", "down");
    void num.offsetWidth;
    num.classList.add(dir);
  }

  function burst(wrap, kind){
    var n = kind === "like" ? 8 : 6, i, a, d, dot;
    for (i = 0; i < n; i++){
      a = (Math.PI * 2 * i) / n + (kind === "idea" ? -Math.PI / 2 : 0);
      d = kind === "like" ? 22 : 24;
      dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--x", Math.cos(a) * d + "px");
      dot.style.setProperty("--y", Math.sin(a) * d + "px");
      wrap.appendChild(dot);
      setTimeout(function(el){ el.remove(); }.bind(null, dot), 700);
    }
    var ring = document.createElement("span");
    ring.className = "ring";
    wrap.appendChild(ring);
    setTimeout(function(){ ring.remove(); }, 600);
  }

  function animate(b, on){
    if (reduce) return;
    var wrap = b.querySelector(".ico-wrap");
    wrap.classList.remove("anim-on", "anim-off");
    void wrap.offsetWidth;
    wrap.classList.add(on ? "anim-on" : "anim-off");
    if (on) burst(wrap, b.dataset.kind);
  }

  function toggle(b){
    var kind = b.dataset.kind;
    var on = b.getAttribute("aria-pressed") !== "true";
    var n = Number(b.dataset.count) + (on ? 1 : -1);
    b.setAttribute("aria-pressed", String(on));
    b.dataset.count = n;
    setCount(b, n, on ? "up" : "down");
    animate(b, on);
    statusEl.textContent = on ? DONE[kind] : "Reaction removed.";
  }

  bar.addEventListener("click", function(e){
    var b = e.target.closest("[data-live]");
    if (b) toggle(b);
  });

  document.getElementById("reset").addEventListener("click", function(){
    bar.querySelectorAll("[data-live]").forEach(function(b){
      b.setAttribute("aria-pressed", "false");
      b.dataset.count = START[b.dataset.kind];
      b.querySelector(".num").textContent = START[b.dataset.kind].toLocaleString();
    });
    statusEl.textContent = "";
  });
})();
</script>
</body>
</html>
